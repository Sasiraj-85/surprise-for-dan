<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>little suprise on 11:11:2026 at 11:11</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; color: #fff; font-family: Georgia, "Times New Roman", serif;
      background: radial-gradient(circle at top, #70254b, #240d25 58%, #100817);
      overflow-x: hidden;
    }
    .hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .heart {
      position: absolute; bottom: -40px; color: #ff9fbd; opacity: .45;
      animation: float 9s linear infinite; font-size: 20px;
    }
    @keyframes float {
      from { transform: translateY(0) rotate(0); opacity: 0; }
      15% { opacity: .5; } to { transform: translateY(-110vh) rotate(35deg); opacity: 0; }
    }
    .card {
      width: min(100%, 620px); padding: clamp(28px, 6vw, 52px);
      text-align: center; border: 1px solid #ffffff35; border-radius: 28px;
      background: #ffffff12; backdrop-filter: blur(12px);
      box-shadow: 0 24px 80px #0006; position: relative;
    }
    .small { color: #ffc3d5; letter-spacing: 3px; text-transform: uppercase; font: 12px Arial, sans-serif; }
    h1 { font-size: clamp(38px, 8vw, 62px); line-height: 1.05; margin: 18px 0; }
    h1 span { color: #ff9fbd; }
    .subtitle { color: #f8dce6; font: 16px/1.7 Arial, sans-serif; }
    .names {
      display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 26px 0 12px;
    }
    input {
      width: min(100%, 210px); padding: 13px 15px; border-radius: 999px;
      border: 1px solid #ffffff55; background: #ffffff18; color: white;
      outline: none; text-align: center; font: 14px Arial, sans-serif;
    }
    input::placeholder { color: #f4c8d7; }
    button {
      border: 0; border-radius: 999px; padding: 13px 24px; margin-top: 14px;
      background: #ff8fb2; color: #351324; font-weight: bold; cursor: pointer;
      transition: transform .2s, background .2s;
    }
    button:hover { transform: translateY(-2px); background: #ffb0c8; }
    .message {
      min-height: 88px; margin: 26px auto 0; max-width: 460px;
      color: #fff1f5; font: 16px/1.8 Arial, sans-serif;
    }
    .signature { margin-top: 26px; color: #ffc3d5; font-style: italic; }
    .hint { margin-top: 22px; color: #ffffff80; font: 11px Arial, sans-serif; }
  </style>
</head>
<body>
  <div class="hearts" id="hearts"></div>
  <main class="card">
    <div class="small">A little something for someone special</div>
    <h1>Our Little<br><span>Love Story</span> ♡</h1>
    <p class="subtitle">Some people make ordinary moments feel magical.</p>

    <div class="names">
      <input id="yourName" placeholder="Your name" maxlength="28" />
    </div>
    <button onclick="showLove()">Open our message ♡</button>
    <div class="signature" id="signature">Made with love ♡</div>
    <div class="hint">Tip: Edit the message in index.html to make it yours.</div>
  </main>

  <script>
    function showLove() {
      const your = document.getElementById('yourName').value.trim() || 'Someone';
      document.getElementById('message').textContent =
        `${their}, Hey!,life la evlo kashtam vanthalum enkita odi vanthudu naan irukken unakaga irupen,una neraiya hurt pannirken,aana unna vittu ponum nu yosichathu illa ,i love you dhanu ,epavume enna vittu poidatha,i miss you darling♡`;
      document.getElementById('signature').textContent = `— With love, ${your} ♡`;
      document.title = `${your} | Our Little Love Story`;
    }

    const holder = document.getElementById('hearts');
    for (let i = 0; i < 18; i++) {
      const heart = document.createElement('span');
      heart.className = 'heart';
      heart.textContent = '♥';
      heart.style.left = `${Math.random() * 100}%`;
      heart.style.animationDelay = `${Math.random() * 9}s`;
      heart.style.animationDuration = `${7 + Math.random() * 7}s`;
      heart.style.fontSize = `${12 + Math.random() * 20}px`;
      holder.appendChild(heart);
    }
  </script>
</body>
</html>
